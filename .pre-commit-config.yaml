repos:
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: pinact
        name: pinact (actions pinned to SHAs)
        entry: pinact run --fix=false --no-api
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
