name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pinact:
    name: Pinact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check actions are pinned
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"

  rubocop:
    name: RuboCop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0.10"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  test:
    name: RSpec (${{ matrix.ruby.name }})
    runs-on: ubuntu-24.04
    needs: [rubocop, dependency-review]
    if: always() && needs.rubocop.result == 'success' && (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped')
    strategy:
      matrix:
        ruby:
          - { name: "3.3", version: "3.3.14" }
          - { name: "3.4", version: "3.4.13" }
          - { name: "4.0", version: "4.0.10" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby ${{ matrix.ruby.version }}
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby.version }}
          bundler-cache: true
      - name: Run RSpec
        run: bundle exec rspec

  brakeman:
    name: Security checks (dogfooding)
    runs-on: ubuntu-24.04
    needs: [test]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0.10"
          bundler-cache: true
      - name: Brakeman report
        run: |
          bundle exec brakeman -A -q --force -f json -o tmp/${{ github.event.pull_request.head.sha || github.sha }}-brakeman.json
      - name: Send Brakeman report to Github if it has warnings
        if: failure()
        uses: ./
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          REPORT_PATH: tmp/${{ github.event.pull_request.head.sha || github.sha }}-brakeman.json
          GITHUB_LATEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUSTOM_MESSAGE_CONTENT: "Please address this issue before merging.<br />Thank you for improving our security!"
