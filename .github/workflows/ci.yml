name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pinact:
    name: Pinact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check actions are pinned
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: "false"

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t brakeman-linter-action:ci .
      - name: Check Brakeman matches Gemfile.lock
        run: |
          expected="brakeman $(sed -n 's/^    brakeman (\(.*\))$/\1/p' Gemfile.lock)"
          actual="$(docker run --rm --entrypoint brakeman brakeman-linter-action:ci --version)"
          echo "expected: $expected, image: $actual"
          test "$actual" = "$expected"
      - name: Check development gems are not installed
        run: docker run --rm --entrypoint sh brakeman-linter-action:ci -c '! gem list -i rubocop'
      - name: Check the action script parses
        run: docker run --rm --entrypoint ruby brakeman-linter-action:ci -c /action/lib/index.rb

  rubocop:
    name: RuboCop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0.10"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  test:
    name: RSpec (${{ matrix.ruby.name }})
    runs-on: ubuntu-24.04
    needs: [rubocop, dependency-review]
    if: always() && needs.rubocop.result == 'success' && (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped')
    strategy:
      matrix:
        ruby:
          - { name: "3.3", version: "3.3.14" }
          - { name: "3.4", version: "3.4.13" }
          - { name: "4.0", version: "4.0.10" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby ${{ matrix.ruby.version }}
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby.version }}
          bundler-cache: true
      - name: Run RSpec
        run: bundle exec rspec

  brakeman:
    name: Security checks (dogfooding)
    runs-on: ubuntu-24.04
    needs: [test]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0.10"
          bundler-cache: true
      - name: Brakeman report
        run: |
          bundle exec brakeman -A -q --force -f json -o tmp/${{ github.event.pull_request.head.sha || github.sha }}-brakeman.json
      - name: Send Brakeman report to Github if it has warnings
        if: failure()
        uses: $/
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          REPORT_PATH: tmp/${{ github.event.pull_request.head.sha || github.sha }}-brakeman.json
          GITHUB_LATEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUSTOM_MESSAGE_CONTENT: "Please address this issue before merging.<br />Thank you for improving our security!"
